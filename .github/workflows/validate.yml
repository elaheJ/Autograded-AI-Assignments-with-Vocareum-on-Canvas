name: Validate examples
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        example: [arena-tools, qlora-demo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: examples/${{ matrix.example }}/requirements-qa.txt
      - name: Install QA dependencies
        run: python -m pip install -r examples/${{ matrix.example }}/requirements-qa.txt
      - name: Validate repository resources
        run: python scripts/check_repository.py
      - name: Execute and grade example notebooks
        run: python examples/${{ matrix.example }}/qa/verify_package.py
